[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnpilot-ml"
version = "2.0.0"
description = "Personalized learning diagnosis, ranking, RAG generation, and tutoring service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "lightgbm==4.6.0",
]

[project.scripts]
learnpilot-ml-api = "ml_service.cli:serve"
learnpilot-ml-generate = "ml_service.cli:generate"
learnpilot-ml-train = "ml_service.cli:train"
learnpilot-ml-evaluate = "ml_service.cli:evaluate"
learnpilot-ml-demo = "ml_service.cli:demo"
learnpilot-ml-qwen-check = "ml_service.cli:check_qwen"
learnpilot-ml-spark-check = "ml_service.cli:check_spark"

[tool.setuptools.packages.find]
where = ["src"]
