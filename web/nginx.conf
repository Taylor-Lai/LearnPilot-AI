server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA routes that share a prefix with backend compatibility APIs.
    location = /resources { try_files /index.html =404; }
    location = /profile { try_files /index.html =404; }
    location = /profile-builder { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /admin/feedback { try_files /index.html =404; }
    location = /admin/dashboard { try_files /index.html =404; }
    location = /admin/tasks { try_files /index.html =404; }
    location = /admin/settings { try_files /index.html =404; }

    location ~ ^/(api|resources|admin|path|profile|profile-builder|producer)(/|$) {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
