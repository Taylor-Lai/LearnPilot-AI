x-backend-image: &backend-image
  image: learnpilot-backend:local
  build:
    context: .
    dockerfile: Dockerfile
    target: backend

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learnpilot_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/mysql:/docker-entrypoint-initdb.d:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  ml-service:
    image: learnpilot-ml:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    environment:
      LEARNPILOT_LLM_MODE: ${LEARNPILOT_LLM_MODE:-template}
      LEARNPILOT_LLM_PROVIDER: ${LEARNPILOT_LLM_PROVIDER:-spark}
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD:-}
      SPARK_MODEL: ${SPARK_MODEL:-4.0Ultra}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8000:8000"

  backend:
    <<: *backend-image
    command: ["sh", "-c", "python backend/scripts/seed_ai_course.py && learnpilot-backend"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ml-service:
        condition: service_started
    environment:
      DATABASE_MODE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      REDIS_URL: redis://redis:6379/0
      PRODUCER_ASYNC_ENABLED: "true"
      PRODUCER_JOB_TIMEOUT_SECONDS: 180
      ML_SERVICE_URL: http://ml-service:8000
      USE_ML_SERVICE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LEARNPILOT_LLM_MODE: ${LEARNPILOT_LLM_MODE:-template}
      LEARNPILOT_LLM_PROVIDER: ${LEARNPILOT_LLM_PROVIDER:-spark}
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD:-}
      SPARK_MODEL: ${SPARK_MODEL:-4.0Ultra}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8001:8001"

  worker:
    <<: *backend-image
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_MODE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8000
      USE_ML_SERVICE: "true"
      LEARNPILOT_LLM_MODE: ${LEARNPILOT_LLM_MODE:-template}
      LEARNPILOT_LLM_PROVIDER: ${LEARNPILOT_LLM_PROVIDER:-spark}
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD:-}
      SPARK_MODEL: ${SPARK_MODEL:-4.0Ultra}

  web:
    image: learnpilot-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
