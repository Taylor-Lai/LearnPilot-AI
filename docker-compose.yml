x-backend-image: &backend-image
  image: learnpilot-backend:local
  build:
    context: .
    dockerfile: Dockerfile
    target: backend

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learnpilot_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/mysql:/docker-entrypoint-initdb.d:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml-service:
    image: learnpilot-ml:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    environment:
      LEARNPILOT_LLM_MODE: ${LEARNPILOT_LLM_MODE:-template}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8000:8000"

  backend:
    <<: *backend-image
    depends_on:
      - mysql
      - redis
      - ml-service
    environment:
      DATABASE_MODE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:8000
      USE_ML_SERVICE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LEARNPILOT_LLM_MODE: ${LEARNPILOT_LLM_MODE:-template}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8001:8001"

  worker:
    <<: *backend-image
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    depends_on:
      - redis
      - mysql
    environment:
      DATABASE_MODE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-learnpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnpilot_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning_agent}
      REDIS_URL: redis://redis:6379/0

  web:
    image: learnpilot-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
