target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "ml/artifacts",
  "ml/data/generated",
  "ml/reports",
]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
"backend/backend/app/api/*.py" = ["B008"]
"backend/backend/app/core/security.py" = ["B008"]
"backend/scripts/*.py" = ["E402"]
"backend/tests/*.py" = ["E402"]
"ml/tests/*.py" = ["E402"]
