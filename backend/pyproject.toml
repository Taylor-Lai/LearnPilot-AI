[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnpilot-backend"
version = "1.0.0"
description = "LearnPilot orchestration and persistence API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.36",
  "PyMySQL==1.1.1",
  "cryptography==44.0.0",
  "psycopg2-binary==2.9.12",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "redis==5.2.1",
  "rq==2.1.0",
  "click==8.1.7",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "reportlab==4.4.3",
]

[project.scripts]
learnpilot-backend = "backend.app.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
